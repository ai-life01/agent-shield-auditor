name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Smoke scan sample (CRITICAL findings expected)
        run: |
          set +e
          python scripts/audit_scanner.py --target assets/sample_vulnerable_agent.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "OK: expected exit code 2 (CRITICAL findings present)"
            exit 0
          fi
          echo "ERROR: expected exit code 2, got $status"
          exit 1
